<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens</title>
</head>
<body>
   
    <h2>Caminho relativo e absoluto</h2>
    <!-- Caminho relativo
         ../ - Sobre um nível 
         ../../ - Sobre dois níveis e essim consecutivamente
         EX: <img src="../../arquivos/praia.jpeg"

         Caminho absoluto
         / -> utiliza um caminho absoluto
    -->
    <img src="/Arquivos/praia.jpeg"
         alt="Imagem de uma praia, vista do alto"
         width="300"
         title = "Praia da Boa Viagem"
    >
</body>
</html>
