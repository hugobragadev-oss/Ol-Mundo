<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens</title>
</head>
<body>

     <img src="arquivos/logo.png">

     <hr>
    <h2>Pilotos de fórmula 1</h2>
    <!-- img - Image (Imagem) 
         src - SouRce (fonte, origem)
         alt - alternative (alternativa)
         tipos imagem: png, jpg, jpeg, gif

         figure (figura) -> usada para definir uma foto, ilustração, 
         diagrama, etc.
    -->

     <figure>
           <img src="arquivos/p1.jpeg"
           width="300">
           <figcaption>Lewis Hamilton</figcaption>
     </figure>

     <figure>
           <img src="arquivos/p2.jpeg"
           width="300">
           <figcaption>Max Verstappen</figcaption>
     </figure>

     <figure>
           <img src="arquivos/p3.jpeg"
           width="300">
           <figcaption>Fernando Alonso</figcaption>
     </figure>

     <p>Continua...</p>
    
</body>
</html>
