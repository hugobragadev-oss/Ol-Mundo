<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

</head>
<body>
    
     <h1>Tabelas</h1>

     <table border="1">
        <tr>
           <th>Produto</th>
           <th>Quantidade</th>
           <th>Preço</th>
        </tr>

        <tr>
            <td>Notebook</td>
            <td>1</td>
            <td>R$2.500</td>         
        </tr>

        <tr>
            <td>Tablet</td>
            <td>1</td>
            <td>R$1.000</td>         
        </tr>

        <tr>
            <td rolspan="2">Desconto</td>
            <td colspan="2">Cupom 1 - R$20,00</td>
        </tr>

        <tr>
            <td colspan="2">Cupom 2 - R$20,00</td>
        </tr>
     </table>

     <h1>Mais sobre tabelas</h1>
    <table border="1">
        <caption>Listagem de produtos</caption>
        <thead>
            <tr>
               <th>Produto</th>
               <th>Quantidade</th>
               <th>Preço</th>
            </tr>
        </thead>

        <tbody>
           <tr>
            <td>Notebook</td>
            <td>1</td>
            <td>R$2.500</td>         
        </tr>
      
        <tr>
            <td>Tablet</td>
            <td>1</td>
            <td>R$1.000</td>         
        </tr> 
        </tbody>

        <tfoot>
            <tr>
                <td>Total</td>
                <td colspan="2">R$4.000</td>
            </tr>
        </tfoot>

    </table>


</body>
</html>
